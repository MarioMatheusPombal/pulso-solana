@keyframes eyes{0%,100%{opacity:.25}50%{opacity:1}}

@media (prefers-reduced-motion:reduce){.comet{display:none}*{animation:none!important}}
</style><rect width="1000" height="520" rx="20" fill="#1C211E"/><text x="40" y="46" fill="#B8B7A9" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="600" letter-spacing="2.6">HOW AN ACTION PASSES THROUGH PULSO</text><rect x="40" y="220" width="150" height="84" rx="12" fill="#242A25" stroke="#29343E" stroke-width="1"/><text x="60" y="250" fill="#B8B7A9" font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" letter-spacing="2">AI AGENT</text><text x="60" y="280" fill="#EEE8D8" font-family="'Crimson Pro',Georgia,serif" font-size="16" font-weight="600">wants to act</text><path d="M190 262 H250" fill="none" stroke="#8A96A3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M190 262 H250" fill="none" stroke="#E6B04B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="comet"/><rect x="250" y="150" width="190" height="224" rx="14" fill="#242A25" stroke="#29343E" stroke-width="1"/><path d="M264 151 H426" fill="none" stroke="#E6B04B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><g><path transform="translate(297 164) scale(0.08)" d="M603 108 L557 132 L523 156 L493 180 L466 204 L441 228 L419 252 L399 276 L381 300 L365 324 L350 348 L336 372 L322 396 L308 420 L294 444 L279 468 L263 492 L247 516 L230 540 L213 564 L196 588 L179 612 L162 636 L145 660 L129 684 L114 708 L100 732 L90 756 L85 780 L95 804 L123 828 L169 852 L223 876 L269 900 L312 924 L353 948 L392 972 L427 996 L460 1020 L491 1044 L519 1068 L546 1092 L571 1116 L597 1140 L616 1158 L626 1158 L653 1134 L680 1110 L709 1086 L738 1062 L768 1038 L799 1014 L833 990 L868 966 L907 942 L949 918 L993 894 L1042 870 L1094 846 L1136 822 L1162 798 L1168 774 L1160 750 L1149 726 L1134 702 L1118 678 L1102 654 L1085 630 L1067 606 L1051 582 L1034 558 L1017 534 L1001 510 L985 486 L970 462 L955 438 L941 414 L928 390 L914 366 L900 342 L885 318 L868 294 L850 270 L829 246 L806 222 L781 198 L753 174 L723 150 L688 126 L650 108Z" fill="#141B23" stroke="#2F3B48" stroke-width="65.31" stroke-linejoin="round"/><image href="../masters/guardian-chalk.webp" x="297" y="164" width="96" height="96" preserveAspectRatio="xMidYMid meet"/><g transform="translate(297 164) scale(0.08)"><g class="eyes"><ellipse cx="511" cy="600" rx="78" ry="60" fill="url(#eye)"/><ellipse cx="740" cy="600" rx="78" ry="60" fill="url(#eye)"/></g></g></g><text x="345" y="292" fill="#EEE8D8" font-family="'Caveat',cursive" font-size="22" font-weight="800" letter-spacing="4" text-anchor="middle">PULSO</text><text x="345" y="318" fill="#B8B7A9" font-family="'Crimson Pro',Georgia,serif" font-size="14" font-weight="400" text-anchor="middle">policy enforced by</text><text x="345" y="338" fill="#B8B7A9" font-family="'Crimson Pro',Georgia,serif" font-size="14" font-weight="400" text-anchor="middle">the on-chain program</text><text x="500" y="78" fill="#A7BE91" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" letter-spacing="1.5">WITHIN DELEGATED AUTHORITY</text><path d="M440 262 C478 262 462 100 500 100 H820" fill="none" stroke="#A7BE91" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 262 C478 262 462 100 500 100 H820" fill="none" stroke="#A7BE91" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="comet" style="animation-delay:0.6s"/><text x="500" y="128" fill="#B8B7A9" font-family="'Crimson Pro',Georgia,serif" font-size="14" font-weight="400">Autonomous. No human in the loop.</text><rect x="830" y="80" width="130" height="40" rx="20" fill="#242A25" stroke="#A7BE91" stroke-width="1.5"/><text x="895" y="105" fill="#A7BE91" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">EXECUTED</text><text x="500" y="216" fill="#E6B04B" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" letter-spacing="1.5">OUTSIDE AUTHORITY · HUMAN_INTENT_REQUIRED</text><path d="M440 262 C478 262 462 262 500 262 H612 l11.2 0 l6.4 -4.8 l8 4.8 l13.6 0 l8 -21.6 l7.2 31.2 l8 -14.4 l9.6 4.8 l16 0 H820" fill="none" stroke="#E6B04B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M440 262 C478 262 462 262 500 262 H612 l11.2 0 l6.4 -4.8 l8 4.8 l13.6 0 l8 -21.6 l7.2 31.2 l8 -14.4 l9.6 4.8 l16 0 H820" fill="none" stroke="#EEE8D8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="comet" style="animation-delay:1.8s"/><text x="500" y="300" fill="#B8B7A9" font-family="'Crimson Pro',Georgia,serif" font-size="14" font-weight="400">The human approves the exact action:</text><text x="500" y="320" fill="#B8B7A9" font-family="'Crimson Pro',Georgia,serif" font-size="14" font-weight="400">scoped, expiring, single-use.</text><rect x="830" y="242" width="130" height="40" rx="20" fill="#242A25" stroke="#A7BE91" stroke-width="1.5"/><text x="895" y="267" fill="#A7BE91" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">EXECUTED</text><text x="500" y="402" fill="#EE8F7D" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" letter-spacing="1.5">CHANGED · REUSED · EXPIRED</text><path d="M440 262 C478 262 462 424 500 424 H820" fill="none" stroke="#EE8F7D" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="2 8"/><text x="500" y="452" fill="#B8B7A9" font-family="'Crimson Pro',Georgia,serif" font-size="14" font-weight="400">Rejected by the program. The agent can</text><text x="500" y="472" fill="#B8B7A9" font-family="'Crimson Pro',Georgia,serif" font-size="14" font-weight="400">never widen its own authority.</text><rect x="830" y="404" width="130" height="40" rx="20" fill="#242A25" stroke="#EE8F7D" stroke-width="1.5"/><text x="895" y="429" fill="#EE8F7D" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">REJECTED</text><text x="40" y="494" fill="#E6B04B" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" letter-spacing="1.5">NOT AUDITED · DEVNET DEMONSTRATION ONLY</text><rect x=".5" y=".5" width="999" height="519" rx="20" fill="none" stroke="#29343E"/></svg>
