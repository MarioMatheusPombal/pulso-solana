<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-label="How an action passes through PULSO: within delegated authority it executes; outside it needs human approval of the exact action; changed, reused or expired authorizations are rejected. NOT AUDITED · DEVNET DEMONSTRATION ONLY"><title>How an action passes through PULSO: within delegated authority it executes; outside it needs human approval of the exact action; changed, reused or expired authorizations are rejected. NOT AUDITED · DEVNET DEMONSTRATION ONLY</title><defs><style>
@font-face{font-family:'Caveat';src:url('../fonts/Caveat.ttf') format('truetype');font-weight:400 700}
@font-face{font-family:'Crimson Pro';src:url('../fonts/CrimsonPro.ttf') format('truetype');font-weight:400 700}
@font-face{font-family:'JetBrains Mono';src:url('../fonts/JetBrainsMono.ttf') format('truetype');font-weight:400 700}
.chalk{font-family:'Caveat',cursive}.editorial{font-family:'Crimson Pro',Georgia,serif}.technical{font-family:'JetBrains Mono',monospace}
</style>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0V40M0 40H40" fill="none" stroke="#586057"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#E6B04B" stop-opacity="0.24"/><stop offset="1" stop-color="#E6B04B" stop-opacity="0"/></radialGradient>
<radialGradient id="eye"><stop offset="0" stop-color="#FFD06A" stop-opacity=".85"/><stop offset="1" stop-color="#E6B04B" stop-opacity="0"/></radialGradient>
<radialGradient id="fade"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="0" x2="1000"><stop offset="0" stop-color="#E6B04B" stop-opacity="0"/><stop offset=".18" stop-color="#E6B04B" stop-opacity=".4"/><stop offset=".56" stop-color="#E6B04B"/><stop offset=".9" stop-color="#E6B04B" stop-opacity=".4"/><stop offset="1" stop-color="#E6B04B" stop-opacity="0"/></linearGradient>
</defs><style>
.comet{stroke-dasharray:.09 .91;animation:run 5s linear infinite}
.eyes{animation:eyes 5s ease-in-out infinite}
