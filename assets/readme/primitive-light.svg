<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="1000" height="340" role="img" aria-label="One authorization is one exact action: human authority, agent, action, asset, amount, recipient, scope, expiration, nonce and usage count bound into a single action hash. NOT AUDITED · DEVNET DEMONSTRATION ONLY"><title>One authorization is one exact action: human authority, agent, action, asset, amount, recipient, scope, expiration, nonce and usage count bound into a single action hash. NOT AUDITED · DEVNET DEMONSTRATION ONLY</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0V40M0 40H40" fill="none" stroke="#E9E5DC"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#FFB020" stop-opacity="0.3"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient>
<radialGradient id="eye"><stop offset="0" stop-color="#FFD06A" stop-opacity=".85"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient>
<radialGradient id="fade"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="0" x2="1000"><stop offset="0" stop-color="#B87400" stop-opacity="0"/><stop offset=".18" stop-color="#B87400" stop-opacity=".4"/><stop offset=".56" stop-color="#B87400"/><stop offset=".9" stop-color="#B87400" stop-opacity=".4"/><stop offset="1" stop-color="#B87400" stop-opacity="0"/></linearGradient>
</defs><style>
.comet{stroke-dasharray:.09 .91;animation:run 5s linear infinite}
.eyes{animation:eyes 5s ease-in-out infinite}
@keyframes run{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes eyes{0%,100%{opacity:.25}50%{opacity:1}}

@media (prefers-reduced-motion:reduce){.comet{display:none}*{animation:none!important}}
</style><rect width="1000" height="340" rx="20" fill="#F6F4EF"/><text x="40" y="42" fill="#62686D" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="600" letter-spacing="2.6">ONE AUTHORIZATION = ONE EXACT ACTION</text><rect x="40" y="64" width="144" height="32" rx="8" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><text x="112" y="85" fill="#14171A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle">human authority</text><rect x="196" y="64" width="144" height="32" rx="8" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><text x="268" y="85" fill="#14171A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle">agent</text><path d="M340 80 C400 80 392 164 450 164" fill="none" stroke="#62686D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><rect x="40" y="106" width="144" height="32" rx="8" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><text x="112" y="127" fill="#14171A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle">action</text><rect x="196" y="106" width="144" height="32" rx="8" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><text x="268" y="127" fill="#14171A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle">asset</text><path d="M340 122 C400 122 392 164 450 164" fill="none" stroke="#62686D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><rect x="40" y="148" width="144" height="32" rx="8" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><text x="112" y="169" fill="#14171A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle">amount</text><rect x="196" y="148" width="144" height="32" rx="8" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><text x="268" y="169" fill="#14171A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle">recipient</text><path d="M340 164 C400 164 392 164 450 164" fill="none" stroke="#62686D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><rect x="40" y="190" width="144" height="32" rx="8" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><text x="112" y="211" fill="#14171A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle">scope</text><rect x="196" y="190" width="144" height="32" rx="8" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><text x="268" y="211" fill="#14171A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle">expiration</text><path d="M340 206 C400 206 392 164 450 164" fill="none" stroke="#62686D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><rect x="40" y="232" width="144" height="32" rx="8" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><text x="112" y="253" fill="#14171A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle">nonce</text><rect x="196" y="232" width="144" height="32" rx="8" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><text x="268" y="253" fill="#14171A" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="400" text-anchor="middle">usage count</text><path d="M340 248 C400 248 392 164 450 164" fill="none" stroke="#62686D" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/><rect x="450" y="124" width="250" height="80" rx="14" fill="#FFFFFF" stroke="#D8D3C9" stroke-width="1"/><path d="M451 140 V188" fill="none" stroke="#FFB020" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="474" y="160" fill="#8A5200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="21" font-weight="700">action_hash</text><text x="474" y="184" fill="#62686D" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">one hash binds every field</text><path d="M700 164 H706 l9.8 0 l5.6 -4.2 l7 4.2 l11.9 0 l7 -18.9 l6.3 27.3 l7 -12.6 l8.4 4.2 l14 0 H790" fill="none" stroke="#B87400" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M700 164 H706 l9.8 0 l5.6 -4.2 l7 4.2 l11.9 0 l7 -18.9 l6.3 27.3 l7 -12.6 l8.4 4.2 l14 0 H790" fill="none" stroke="#14171A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="comet"/><text x="745" y="126" fill="#62686D" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle">human signs</text><rect x="790" y="124" width="170" height="80" rx="14" fill="#FFFFFF" stroke="#14734B" stroke-width="1"/><text x="808" y="160" fill="#14171A" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700">Enforced on-chain</text><text x="808" y="184" fill="#62686D" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="14" font-weight="400">by the program</text><text x="450" y="252" fill="#62686D" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="400">Change the amount, change the recipient, reuse it,</text><text x="450" y="275" fill="#14171A" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" font-weight="700">or let it expire, and it stops being valid.</text><text x="40" y="318" fill="#8A5200" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" font-weight="700" letter-spacing="1.5">NOT AUDITED · DEVNET DEMONSTRATION ONLY</text><rect x=".5" y=".5" width="999" height="339" rx="20" fill="none" stroke="#D8D3C9"/></svg>
