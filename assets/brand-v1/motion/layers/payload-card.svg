<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="PULSO payload card frame. Values are filled from the real request, never invented or animated."><title>PULSO payload card frame. Values are filled from the real request, never invented or animated.</title><g id="payload-card"><rect x="520" y="120" width="880" height="840" rx="22" fill="#10161D" stroke="#29343E" stroke-width="1"/><path d="M544 121 H1376" fill="none" stroke="#FFB020" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="568" y="198" fill="#FFB020" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="700" letter-spacing="3">HUMAN_INTENT_REQUIRED</text><text x="568" y="258" fill="#F6F4EF" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="44" font-weight="800">Review the exact payload</text><g id="payload-rows"><text x="568" y="356" fill="#C0C4C8" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400">Action</text><text x="770" y="356" fill="#F6F4EF" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="400" id="v-action"></text><path d="M568 376 H1352" fill="none" stroke="#29343E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="568" y="414" fill="#C0C4C8" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400">Amount</text><text x="770" y="414" fill="#F6F4EF" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="22" font-weight="400" id="v-amount"></text><path d="M568 434 H1352" fill="none" stroke="#29343E" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/><text x="568" y="472" fill="#C0C4C8" font-family="system-ui,-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400">Mint</text><text x="770" y="472" fil