<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="PULSO grid backdrop"><title>PULSO grid backdrop</title><defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0V40M0 40H40" fill="none" stroke="#E9E5DC"/></pattern>
<radialGradient id="glow"><stop offset="0" stop-color="#FFB020" stop-opacity="0.3"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient>
<radialGradient id="eye"><stop offset="0" stop-color="#FFD06A" stop-opacity=".85"/><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient>
<radialGradient id="fade"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<linearGradient id="pulse" gradientUnits="userSpaceOnUse" x1="0" x2="1920"><stop offset="0" stop-color="#B87400" stop-opacity="0"/><stop offset=".18" stop-color="#B87400" stop-opacity=".4"/><stop offset=".56" stop-color="#B87400"/><stop offset=".9" stop-color="#B87400" stop-opacity=".4"/><stop offset="1" stop-color="#B87400" stop-opacity="0"/></linearGradient>
</defs><rect id="bg" width="1920" height="1080" fill="#F6F4EF"/><mask id="m"><ellipse cx="960" cy="540" rx="1100" ry="640" fill="url(#fade)"/></mask><rect id="grid-lines" width="1920" height="1080" fill="url(#grid)" mask="url(#m)"/></svg>
