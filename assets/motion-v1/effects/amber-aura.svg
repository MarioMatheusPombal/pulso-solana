<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="360" viewBox="0 0 640 360"><title>PULSO amber aura · 1</title><desc>NOT AUDITED · DEVNET DEMONSTRATION ONLY. Editable code-native animation. A static layer appears when reduced motion is requested.</desc><style>@media (prefers-reduced-motion: reduce){.motion{display:none!important}.still{display:inline!important}}</style><g class="motion"><defs><radialGradient id="g0"><stop stop-color="#FFB020" stop-opacity=".48"><animate attributeName="stop-opacity" values=".3;.62;.3" dur="5s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient></defs><circle cx="100" cy="70" r="110" fill="url(#g0)"><animate attributeName="r" values="110;135;110" dur="6s" repeatCount="indefinite"/><animate attributeName="cx" values="100;72;100" dur="6s" repeatCount="indefinite"/></circle></g><g class="still" display="none"><defs><radialGradient id="g0-static"><stop stop-color="#FFB020" stop-opacity=".48"></stop><stop offset="1" stop-color="#FFB020" stop-opacity="0"/></radialGradient></defs><circle cx="100" cy="70" r="110" fill="url(#g0-static)"></circle></g></svg>