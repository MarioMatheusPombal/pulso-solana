<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="360" viewBox="0 0 640 360"><title>PULSO radial open · 3</title><desc>NOT AUDITED · DEVNET DEMONSTRATION ONLY. Editable code-native animation. A static layer appears when reduced motion is requested.</desc><style>@media (prefers-reduced-motion: reduce){.motion{display:none!important}.still{display:inline!important}}</style><g class="motion"><circle cx="0" cy="180" r="0" fill="#FFB020" opacity=".75"><animate attributeName="r" values="0;480;0" dur="6s" repeatCount="indefinite"/></circle></g><g class="still" display="none"><circle cx="0" cy="180" r="0" fill="#FFB020" opacity=".75"></circle></g></svg>