<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="360" viewBox="0 0 640 360"><title>PULSO quiet orbit · 1</title><desc>NOT AUDITED · DEVNET DEMONSTRATION ONLY. Editable code-native animation. A static layer appears when reduced motion is requested.</desc><style>@media (prefers-reduced-motion: reduce){.motion{display:none!important}.still{display:inline!important}}</style><g class="motion"><ellipse cx="320" cy="180" rx="95" ry="40" fill="none" stroke="#FFB020" stroke-width="2" opacity=".72" transform="rotate(0 320 180)"><animateTransform attributeName="transform" type="rotate" values="0 320 180;360 320 180" dur="6s" repeatCount="indefinite"/></ellipse><circle cx="415" cy="180" r="5" fill="#FFB020"><animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></circle></g><g class="still" display="none"><ellipse cx="320" cy="180" rx="95" ry="40" fill="none" stroke="#FFB020" stroke-width="2" opacity=".72" transform="rotate(0 320 180)"></ellipse><circle cx="415" cy="180" r="5" fill="#FFB020"></circle></g></svg>