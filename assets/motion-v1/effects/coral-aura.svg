<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="360" viewBox="0 0 640 360"><title>PULSO coral aura · 2</title><desc>NOT AUDITED · DEVNET DEMONSTRATION ONLY. Editable code-native animation. A static layer appears when reduced motion is requested.</desc><style>@media (prefers-reduced-motion: reduce){.motion{display:none!important}.still{display:inline!important}}</style><g class="motion"><defs><radialGradient id="g1"><stop stop-color="#C6534C" stop-opacity=".48"><animate attributeName="stop-opacity" values=".3;.62;.3" dur="6s" repeatCount="indefinite"/></stop><stop offset="1" stop-color="#C6534C" stop-opacity="0"/></radialGradient></defs><circle cx="197" cy="113" r="138" fill="url(#g1)"><animate attributeName="r" values="138;163;138" dur="7s" repeatCount="indefinite"/><animate attributeName="cx" values="197;225;197" dur="7s" repeatCount="indefinite"/></circle></g><g class="still" display="none"><defs><radialGradient id="g1-static"><stop stop-color="#C6534C" stop-opacity=".48"></stop><stop offset="1" stop-color="#C6534C" stop-opacity="0"/></radialGradient></defs><circle cx="197" cy="113" r="138" fill="url(#g1-static)"></circle></g></svg>