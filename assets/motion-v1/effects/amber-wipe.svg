<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="360" viewBox="0 0 640 360"><title>PULSO amber wipe · 1</title><desc>NOT AUDITED · DEVNET DEMONSTRATION ONLY. Editable code-native animation. A static layer appears when reduced motion is requested.</desc><style>@media (prefers-reduced-motion: reduce){.motion{display:none!important}.still{display:inline!important}}</style><g class="motion"><rect x="0" y="0" width="0" height="360" fill="#FFB020"><animate attributeName="width" values="0;640;0" keyTimes="0;.5;1" dur="6s" repeatCount="indefinite"/></rect></g><g class="still" display="none"><rect x="0" y="0" width="0" height="360" fill="#FFB020"></rect></g></svg>