<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="640" height="360" viewBox="0 0 640 360"><title>PULSO double orbit · 2</title><desc>NOT AUDITED · DEVNET DEMONSTRATION ONLY. Editable code-native animation. A static layer appears when reduced motion is requested.</desc><style>@media (prefers-reduced-motion: reduce){.motion{display:none!important}.still{display:inline!important}}</style><g class="motion"><ellipse cx="320" cy="180" rx="120" ry="64" fill="none" stroke="#C6534C" stroke-width="3" opacity=".72" transform="rotate(13 320 180)"><animateTransform attributeName="transform" type="rotate" values="13 320 180;373 320 180" dur="7s" repeatCount="indefinite"/></ellipse><circle cx="440" cy="180" r="5" fill="#FFB020"><animate attributeName="opacity" values=".45;1;.45" dur="4s" repeatCount="indefinite"/></circle><circle cx="200" cy="180" r="6" fill="#F6F4EF"><animate attributeName="opacity" values=".45;1;.45" dur="5s" repeatCount="indefinite"/></circle></g><g class="still" display="none"><ellipse cx="320" cy="180" rx="120" ry="64" fill="none" stroke="#C6534C" stroke-width="3" opacity=".72" transform="rotate(13 320 180)"></ellipse><circle cx="440" cy="180" r="5" fill="#FFB020"></circle><circle cx="200" cy="180" r="6" fill="#F6F4EF"></circle></g></svg>