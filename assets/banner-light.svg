<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="PULSO - Human Intent Protocol">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FBFAF7"/>
      <stop offset="1" stop-color="#F2F0EA"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.00" stop-color="#C27803" stop-opacity="0"/>
      <stop offset="0.26" stop-color="#C27803" stop-opacity="0.28"/>
      <stop offset="0.53" stop-color="#C27803" stop-opacity="1"/>
      <stop offset="0.78" stop-color="#C27803" stop-opacity="0.28"/>
      <stop offset="1.00" stop-color="#C27803" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#C27803" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#C27803" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 V40 M0 40 H40" fill="none" stroke="#E7E3DA" stroke-width="1"/>
    </pattern>
    <clipPath id="round">
      <rect width="1200" height="340" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)" opacity="0.65"/>
    <circle cx="638" cy="234" r="118" fill="url(#glow)"/>

    <text x="64" y="86" font-family="Consolas, Menlo, monospace" font-size="12.5" letter-spacing="4.4" fill="#9A9386">ACTOR &#183; ACTION &#183; PARAMS &#183; AUDIENCE &#183; NONCE &#183; EXPIRY &#183; SIGNATURE</text>

    <text x="62" y="198" font-family="Arial, Helvetica, sans-serif" font-size="118" font-weight="700" letter-spacing="11" fill="#0B0E12">PULSO</text>
    <text x="66" y="240" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="600" letter-spacing="8.2" fill="#6E695C">HUMAN INTENT PROTOCOL</text>

    <text x="1136" y="156" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#6E695C">N&#227;o detectamos o que &#233; falso.</text>
    <text x="1136" y="190" text-anchor="end" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="600" fill="#0B0E12">Provamos o que foi autorizado.</text>

    <path d="M0 288 H520 l 28 0 l 16 -12 l 20 12 l 34 0 l 20 -54 l 18 78 l 20 -36 l 24 12 H1200"
          fill="none" stroke="url(#pulse)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="638" cy="234" r="12" fill="none" stroke="#C27803" stroke-opacity="0.45" stroke-width="1.2"/>
    <circle cx="638" cy="234" r="4.6" fill="#C27803"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="20" fill="none" stroke="#E2DDD2" stroke-width="1"/>
</svg>
